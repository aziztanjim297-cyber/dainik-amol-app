name: dainik_amol
description: Comprehensive Islamic daily routine app.
publish_to: 'none'
version: 1.1.6+5

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  path_provider: ^2.1.5
  adhan: ^2.0.0+1
  hijri: ^3.0.0
  http: ^1.2.0
  syncfusion_flutter_pdfviewer: ^29.1.39
  syncfusion_flutter_pdf: ^29.1.39
  cupertino_icons: ^1.0.6
  geolocator: ^13.0.2
  country_picker: ^2.0.27
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  workmanager: ^0.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
