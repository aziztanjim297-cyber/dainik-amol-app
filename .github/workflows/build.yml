name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Scaffolding & Fix Kotlin Version
        run: |
          # অ্যান্ড্রয়েড ফাইল তৈরি করা
          flutter create --project-name dainik_amol --org com.aziztanjim.dainikamol temp_scaffold
          cp -r temp_scaffold/android ./android
          rm -rf temp_scaffold

          # Kotlin সংস্করণ 1.9.22-এ আপডেট করা
          if [ -f android/build.gradle ]; then
            sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          fi
          if [ -f android/settings.gradle ]; then
            sed -i 's/org.jetbrains.kotlin.android" version "[^"]*"/org.jetbrains.kotlin.android" version "1.9.22"/' android/settings.gradle || true
          fi

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Amol-App
          path: build/app/outputs/flutter-apk/app-release.apk
