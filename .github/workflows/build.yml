name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: 'stable'

      - name: Generate Android Scaffolding
        run: |
          flutter create --project-name dainik_amol --org com.aziztanjim.dainikamol temp_scaffold
          cp -r temp_scaffold/android ./android
          rm -rf temp_scaffold

      - name: Configure Android Desugaring and NDK
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path('android/app/build.gradle.kts')
          s = p.read_text()

          s = s.replace(
              'ndkVersion = flutter.ndkVersion',
              'ndkVersion = "27.0.12077973"'
          )

          if 'isCoreLibraryDesugaringEnabled' not in s:
              s, n = re.subn(
                  r'(compileOptions\s*\{)',
                  r'\1\n        isCoreLibraryDesugaringEnabled = true',
                  s,
                  count=1
              )
              if n == 0:
                  raise SystemExit("compileOptions block পাওয়া যায়নি")

          if 'desugar_jdk_libs' not in s:
              if re.search(r'dependencies\s*\{', s):
                  s = re.sub(
                      r'(dependencies\s*\{)',
                      r'\1\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      s,
                      count=1
                  )
              else:
                  s += '\n\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

          p.write_text(s)
          print("Desugaring এবং NDK কনফিগারেশন সফল")
          PYTHON


      - name: Inject Android Permissions
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.VIBRATE",
              "android.permission.WAKE_LOCK",
              "android.permission.RECEIVE_BOOT_COMPLETED",
          ]

          match = re.search(r"<manifest\b[^>]*>", s)
          if not match:
              raise SystemExit("Manifest opening tag পাওয়া যায়নি")

          additions = ""
          for permission in permissions:
              if f'android:name="{permission}"' not in s:
                  additions += f'\n    <uses-permission android:name="{permission}"/>'

          s = s[:match.end()] + additions + s[match.end():]

          receivers = """
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
              <receiver
                  android:exported="false"
                  android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                  <intent-filter>
                      <action android:name="android.intent.action.BOOT_COMPLETED"/>
                      <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
                      <action android:name="android.intent.action.QUICKBOOT_POWERON"/>
                      <action android:name="com.htc.intent.action.QUICKBOOT_POWERON"/>
                  </intent-filter>
              </receiver>
          """

          if "com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" not in s:
              app_end = s.rfind("</application>")
              if app_end < 0:
                  raise SystemExit("Manifest application closing tag পাওয়া যায়নি")
              s = s[:app_end] + receivers + "\n" + s[app_end:]

          p.write_text(s)
          print("Android permissions ও notification receivers configured successfully")
          PYTHON
      - name: Install Dependencies
        run: flutter pub get

      - name: Set App Name and Generate Launcher Icons
        run: |
          python3 -c 'from pathlib import Path; import re; p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text(); s,n=re.subn(r"android:label=\"[^\"]*\"", "android:label=\"দৈনিক আমল\"", s, count=1); n or exit("App label পাওয়া যায়নি"); p.write_text(s)'
          dart run flutter_launcher_icons

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Amol-App
          path: build/app/outputs/flutter-apk/app-release.apk
