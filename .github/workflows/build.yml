name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Generate Android Scaffolding Safely
        run: |
          # হাইফেন সমস্যা এড়াতে আলাদা ফোল্ডারে অ্যান্ড্রয়েড ফাইল তৈরি করা
          flutter create --project-name dainik_amol --org com.aziztanjim.dainikamol temp_scaffold
          # শুধুমাত্র android ফোল্ডারটি প্রজেক্টে যুক্ত করা
          cp -r temp_scaffold/android ./android
          rm -rf temp_scaffold

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dainik-Amol-App
          path: build/app/outputs/flutter-apk/app-release.apk
